<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>V75 Internal NIS Electronic Schedule</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Simple mark: "V75" + "NIS" designed to remain legible at 16px -->
  <g fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-weight="800">
    <text x="32" y="30" font-size="22" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.5">V75</text>
    <text x="32" y="46" font-size="14" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.6">NIS</text>
  </g>
</svg>